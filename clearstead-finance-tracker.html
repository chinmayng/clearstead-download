<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Personal Finance & Expense Tracker</title>
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; img-src data:; object-src 'none'; base-uri 'none'; form-action 'none'">

<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#16231f;--mute:#5f6e69;--line:#e4e8e5;--acc:#0f766e;--tint:#e6f2f0;--inc:#15803d;--warn:#b45309;--warnbg:#fdf3e3;--on:#fff;--sh:0 1px 2px rgba(20,40,34,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1513;--card:#161f1c;--ink:#eaf1ee;--mute:#9aaaa4;--line:#26322e;--acc:#2dd4bf;--tint:#17302c;--inc:#4ade80;--warn:#f0a752;--warnbg:#2a2113;--on:#07201c;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1513;--card:#161f1c;--ink:#eaf1ee;--mute:#9aaaa4;--line:#26322e;--acc:#2dd4bf;--tint:#17302c;--inc:#4ade80;--warn:#f0a752;--warnbg:#2a2113;--on:#07201c;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}

.rb{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 0 4px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;color:var(--mute);font-weight:600}
.seg button.on{background:var(--acc);color:var(--on)}
.rng{display:flex;align-items:center;gap:8px;font-weight:600}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.rng input{width:auto;padding:6px 8px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));margin:16px 0}
.full{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--sh)}
h2{font-size:13px;margin:0 0 14px;color:var(--mute);font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
h2 a{color:var(--acc);text-transform:none;letter-spacing:0;font-size:14px;background:none;border:0;padding:0}
.big{font-size:clamp(34px,6vw,48px);font-weight:700;letter-spacing:-1px;line-height:1.1;font-variant-numeric:tabular-nums}

.st{background:var(--bg);border-radius:12px;padding:12px 14px}.st b{display:block;font-size:20px;font-variant-numeric:tabular-nums;margin-top:2px}
.inc{color:var(--inc)}.warn{color:var(--warn)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}.bar.o i{background:var(--warn)}

.ins{background:var(--tint);border-color:transparent}.ins.w{background:var(--warnbg)}.ins p{margin:6px 0 0;font-size:16px}

.amtin{font-size:32px!important;font-weight:700;padding:10px 14px!important}

@media(max-width:719px){
nav{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:9}

.fl{grid-template-columns:1fr 1fr}.fl input{grid-column:1/-1}.sum{grid-template-columns:1fr 1fr}.card{padding:16px}
.sheet{top:auto;bottom:0;left:0;transform:none;width:100%;border-radius:20px 20px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
.bn{background:var(--tint);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:12px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}.bn.w{background:var(--warnbg)}.bn .btn{padding:5px 11px}
.dg{color:var(--warn);border-color:var(--warn)}.card p{margin:0 0 12px}.card ul{margin:0;padding-left:20px;color:var(--mute)}.card li{margin:5px 0}.btn[disabled]{opacity:.5;cursor:not-allowed}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:max-content;max-width:min(560px,calc(100% - 24px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:30;font-size:14px}.toast.w{background:var(--warn);color:var(--on)}
</style></head><body>
<header class="top"><div class="wrap hd"><div class="brand"><span class="logo">F</span>Finance Tracker</div>
<nav id="nav"><button data-a="view" data-v="overview">Overview</button><button data-a="view" data-v="tx">Transactions</button><button data-a="view" data-v="budgets">Budgets</button><button data-a="view" data-v="goals">Goals</button><button data-a="view" data-v="data">Backup</button></nav>
<button class="btn pri add" data-a="add">+ Add transaction</button></div></header>
<div class="wrap"><div id="rb" class="rb"></div><main id="app"></main>
<footer><span>🔒 Private by design: your data stays in this browser. Nothing is uploaded or shared.</span>
<label>Currency <select id="cur"><option>USD</option><option>EUR</option><option>GBP</option><option>INR</option></select></label>
<button class="lk" data-a="view" data-v="data">Backup, privacy &amp; help</button></footer></div>
<button class="fab" data-a="add" aria-label="Add transaction">+</button><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),K="ledgerly.v1",pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9),PAL=["#0f766e","#6366f1","#d97706","#0ea5e9","#be185d","#65a30d","#7c3aed","#64748b","#ea580c","#0891b2"];
const PAY=["Card","Cash","Bank transfer","Digital wallet"];
const baseCats=()=>[["housing","Housing"],["groc","Groceries"],["dine","Dining"],["trans","Transport"],["shop","Shopping"],["health","Health"],["fun","Entertainment"],["bills","Bills"],["other","Other"]].map(([id,name],i)=>({id,name,type:"expense",color:PAL[i%PAL.length]})).concat([["salary","Salary","#15803d"],["free","Freelance","#4d7c0f"],["oinc","Other income","#0d9488"]].map(([id,name,color])=>({id,name,type:"income",color})));
function seed(){
 let r=7;const rnd=()=>(r=r*16807%2147483647)/2147483647,rg=(a,b)=>Math.round((a+rnd()*(b-a))*100)/100,pk=a=>a[Math.floor(rnd()*a.length)],tx=[];
 const add=(d,type,cat,merchant,amount,pay)=>tx.push({id:"s"+tx.length,type,cat,merchant,amount,pay,date:iso(d),note:""});
 const now=new Date();
 for(let i=-80;i<=0;i++){const d=addD(now,i),dm=d.getDate();
  if(dm==1)add(d,"income","salary","Northwind Co.",4200,"Bank transfer");
  if(dm==18)add(d,"income","free","Studio Brightside",650,"Bank transfer");
  if(dm==2)add(d,"expense","housing","Maple Street Rent",1450,"Bank transfer");
  if(dm==5)add(d,"expense","bills","Fiber Internet",62,"Card");
  if(dm==9)add(d,"expense","bills","City Electric",rg(60,90),"Bank transfer");
  if(rnd()<.3)add(d,"expense","groc",pk(["Green Basket","Fresh Market"]),rg(25,85),"Card");
  if(rnd()<.24)add(d,"expense","dine",pk(["Corner Café","Noodle House","Lunch Box"]),rg(8,38),pk(["Card","Digital wallet"]));
  if(rnd()<.2)add(d,"expense","trans",pk(["Metro Card","Quick Ride"]),rg(6,26),"Digital wallet");
  if(rnd()<.07)add(d,"expense","shop",pk(["Atlas Books","Home & Co."]),rg(20,110),"Card");
  if(rnd()<.04)add(d,"expense","health","Willow Pharmacy",rg(12,55),"Card");
  if(rnd()<.06)add(d,"expense","fun",pk(["Cinema 8","StreamBox"]),rg(10,28),"Card");}
 return{tx,cats:baseCats(),budgets:{housing:1500,groc:360,dine:160,trans:110,shop:180,health:80,fun:70,bills:160,other:100},opening:2400,cur:"USD",goals:[{id:"g1",name:"Emergency fund",target:5000,saved:1800,due:""},{id:"g2",name:"Summer trip",target:1500,saved:420,due:iso(addD(now,120))}]};}
const KD=K+".demo",KM=K+".mode";
const rd=k=>{try{return localStorage.getItem(k)}catch(e){return null}},wr=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};
let corrupt=false;
const norm=o=>{if(!o||!Array.isArray(o.tx)||!Array.isArray(o.cats)||!o.cats.length)return null;o.budgets=o.budgets&&typeof o.budgets==="object"?o.budgets:{};o.goals=Array.isArray(o.goals)?o.goals:[];o.opening=+o.opening||0;if(!["USD","EUR","GBP","INR"].includes(o.cur))o.cur="USD";return o};
const load=k=>{const raw=rd(k);if(!raw)return null;try{const o=norm(JSON.parse(raw));if(o)return o}catch(e){}wr(k+".corrupt",raw);corrupt=true;return null};
const emptyS=()=>({tx:[],cats:baseCats(),budgets:{},goals:[],opening:0,cur:"USD"});
const USER=load(K);let inDemo=rd(KM)==="demo"||(!USER&&rd(KM)!=="user");
let S=inDemo?(load(KD)||seed()):(USER||emptyS());
const storeOK=wr(K+".t","1");
const save=()=>{const ok=wr(inDemo?KD:K,JSON.stringify(S));if(!ok)toast("We couldn’t save to this browser’s storage (it may be full or blocked). Download a backup now so you don’t lose your work.",1);return ok};
const ui={view:"overview",mode:"month",anchor:new Date(),from:"",to:"",q:"",type:"all",cat:"all",all:false,del:false,dup:false,pend:null,last:[]};
const cat=id=>S.cats.find(c=>c.id===id)||{name:"Other",color:"#64748b",type:"expense"};
const fmt=(n,d=0)=>new Intl.NumberFormat(undefined,{style:"currency",currency:S.cur,minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const fd=s=>pd(s).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const sum=(L,t)=>L.filter(x=>x.type===t).reduce((a,x)=>a+x.amount,0);
const cmp=(a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id);
function range(){const a=ui.anchor;
 if(ui.mode==="week"){const s=addD(a,-((a.getDay()+6)%7));return[s,addD(s,6)]}
 if(ui.mode==="month")return[new Date(a.getFullYear(),a.getMonth(),1),new Date(a.getFullYear(),a.getMonth()+1,0)];
 const f=ui.from?pd(ui.from):addD(new Date(),-29),t=ui.to?pd(ui.to):new Date();return f<=t?[f,t]:[t,f]}
const inR=(s,e)=>S.tx.filter(t=>t.date>=iso(s)&&t.date<=iso(e));
const nDays=(s,e)=>Math.round((e-s)/864e5)+1;
const byCat=L=>{const m={};L.filter(t=>t.type==="expense").forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amount);return m};
const row=t=>{const c=cat(t.cat),inc=t.type==="income";return`<button class="row" data-a="edit" data-id="${t.id}" aria-label="${inc?"Income":"Expense"}: ${esc(t.merchant)}"><i class="dot" style="background:${c.color}"></i><span class="rm"><b>${esc(t.merchant)}</b><small>${esc(c.name)} · ${fd(t.date)}${t.pay?" · "+esc(t.pay):""}</small></span><span class="amt ${t.type}">${inc?"+":"−"}${fmt(t.amount,2)}</span></button>`};
const empty=(msg,btn)=>`<div class="empty"><p>${msg}</p>${btn||""}</div>`;
const addBtn=`<button class="btn pri" data-a="add">+ Add transaction</button>`;

function chrome(){
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===ui.view));
 const[s,e]=range(),lab=ui.mode==="month"?s.toLocaleDateString(undefined,{month:"long",year:"numeric"}):fd(iso(s))+" – "+fd(iso(e));
 $("#rb").innerHTML=`<div class="seg" role="group" aria-label="Period">${["week","month","custom"].map(m=>`<button data-a="mode" data-m="${m}" class="${ui.mode===m?"on":""}">${m[0].toUpperCase()+m.slice(1)}</button>`).join("")}</div>
 <div class="rng"><button class="ib" data-a="step" data-d="-1" aria-label="Previous period">‹</button>${ui.mode==="custom"?`<input type="date" id="cf" value="${iso(s)}" aria-label="From"> – <input type="date" id="ct" value="${iso(e)}" aria-label="To">`:`<span>${lab}</span>`}<button class="ib" data-a="step" data-d="1" aria-label="Next period">›</button></div>`;
 $("#cur").value=S.cur}

function insight(T,by,inc,exp,k,e){
 if(!T.length)return["Welcome","Add your first transaction and a short, friendly insight will appear here."];
 let b=null;S.cats.filter(c=>c.type==="expense").forEach(c=>{const bd=(S.budgets[c.id]||0)*k;if(bd>0){const sp=by[c.id]||0,r=sp/bd;if(!b||r>b.r)b={c,sp,bd,r}}});
 const today=new Date(),left=e>=today&&ui.mode!=="custom"?Math.round((e-today)/864e5):0,dl=left>0?` with ${left} day${left>1?"s":""} to go`:"";
 if(b&&b.r>=1)return["Worth a look",`${b.c.name} is ${fmt(b.sp-b.bd)} over its budget so far. If you’d like to ease back, small swaps over the coming days can help.`,1];
 if(b&&b.r>=.8)return["Heads up",`${b.c.name} has used ${Math.round(b.r*100)}% of its budget${dl}. You have ${fmt(b.bd-b.sp)} left${left>0?`, about ${fmt((b.bd-b.sp)/left)} a day`:""}.`,1];
 if(inc>0&&exp<=inc)return["Looking steady",`You’ve kept ${Math.round((inc-exp)/inc*100)}% of your income this period, and every category is within its budget.`];
 return["Looking steady","Spending is within your budgets. Nice and steady."]}

function overview(){
 const[s,e]=range(),T=inR(s,e),inc=sum(T,"income"),exp=sum(T,"expense"),sav=inc-exp,by=byCat(T),days=nDays(s,e),k=ui.mode==="month"?1:days/30.4;
 const bal=S.opening+sum(S.tx,"income")-sum(S.tx,"expense");
 const tb=S.cats.reduce((a,c)=>a+(c.type==="expense"?(S.budgets[c.id]||0)*k:0),0),over=exp>tb;
 const items=S.cats.filter(c=>c.type==="expense"&&(S.budgets[c.id]||0)>0).map(c=>({c,sp:by[c.id]||0,bd:S.budgets[c.id]*k})).sort((a,b)=>b.sp/b.bd-a.sp/a.bd).slice(0,4);
 const bud=tb>0?`<div class="big ${over?"warn":""}">${fmt(Math.abs(tb-exp))}</div><div class="sub">${over?"over budget":"left to spend"} · ${fmt(exp)} of ${fmt(tb)}${ui.mode==="month"?"":" (prorated)"}</div><div class="bar bl ${over?"o":""}"><i style="width:${Math.min(100,exp/tb*100)}%"></i></div>`+items.map(x=>`<div class="bl"><div class="t"><span>${esc(x.c.name)}</span><span class="sub">${fmt(x.sp)} / ${fmt(x.bd)}</span></div><div class="bar ${x.sp>x.bd?"o":""}"><i style="width:${Math.min(100,x.sp/x.bd*100)}%"></i></div></div>`).join(""):empty("Set monthly budgets to see how spending compares.",`<button class="btn" data-a="view" data-v="budgets">Set budgets</button>`);
 const[it,tx,w]=insight(T,by,inc,exp,k,e);
 const grp=days>45?7:1,bk=[];for(let i=0;i<days;i+=grp)bk.push({a:addD(s,i),v:0});
 T.filter(t=>t.type==="expense").forEach(t=>{bk[Math.floor(Math.round((pd(t.date)-s)/864e5)/grp)].v+=t.amount});
 const mx=Math.max(1,...bk.map(b=>b.v)),el=Math.min(days,Math.max(1,nDays(s,new Date())));

 const cs=Object.entries(by).sort((a,b)=>b[1]-a[1]),C=2*Math.PI*52;let cum=0;

 <div class="ac" style="flex-wrap:wrap"><input id="gn" maxlength="60" placeholder="Goal name" aria-label="Goal name" style="flex:2 1 160px;width:auto"><input id="gt" type="number" min="1" step="0.01" placeholder="Target" aria-label="Target amount" style="flex:1 1 100px;width:auto"><input id="gd" type="date" aria-label="Target date (optional)" style="flex:1 1 140px;width:auto"><button class="btn pri" data-a="addgoal">Add goal</button></div><div class="err" id="gerr" role="alert"></div><p class="sub">Goal balances are tracked on their own. They don’t change your available balance or transactions.</p></section></div>`}
function catsCard(){return`<section class="card full"><h2>Manage categories</h2>${["expense","income"].map(t=>`<div class="dh">${t==="expense"?"Expense":"Income"} categories</div>`+S.cats.filter(c=>c.type===t).map(c=>`<div class="bi"><i class="dot" style="background:${c.color}"></i><input style="width:auto;flex:1;text-align:left" maxlength="40" data-cn="${c.id}" value="${esc(c.name)}" aria-label="Rename ${esc(c.name)}"><button class="btn" data-a="delcat" data-id="${c.id}">Delete</button></div>`).join("")).join("")}<div class="ac"><input id="nc" maxlength="40" placeholder="New category name" aria-label="New category name"><select id="nt" style="width:auto" aria-label="Category type"><option value="expense">Expense</option><option value="income">Income</option></select><button class="btn" data-a="addcat">Add</button></div><p class="sub" style="margin-top:12px">Deleting a category moves its transactions to “Other” (or “Other income”).</p></section>`}
function dataV(){const d=inDemo,p=ui.pend;
 const pend=p?`<div class="bn" style="flex-direction:column;align-items:flex-start"><b>Ready to restore “${esc(p.name)}”</b><span>${p.s.tx.length} transactions, ${p.s.cats.length} categories, ${p.s.goals.length} goals${p.bad?`; ${p.bad} invalid entries will be skipped`:""}. This replaces your current data (${S.tx.length} transactions). Consider downloading a backup of your current data first.</span><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-a="dorestore">Replace my data</button><button class="btn" data-a="backup">Download current backup</button><button class="btn" data-a="cancelrestore">Cancel</button></span></div>`:"";
 return`<div class="grid"><section class="card"><h2>Back up &amp; restore</h2><p>Your data lives only in this browser. A backup file lets you move it to another device or recover it if browser data is cleared. Back up regularly, for example weekly.</p><div class="ac" style="flex-wrap:wrap"><button class="btn pri" data-a="backup">Download backup</button><button class="btn" data-a="pick" ${d?"disabled":""}>Restore from backup…</button></div><input type="file" id="rf" accept=".json,application/json" hidden>${d?`<p class="sub" style="margin-top:12px">Restoring is available when you’re using your own data.</p>`:""}${pend}</section>
 <section class="card"><h2>Export to a spreadsheet</h2><p>Download every transaction as a CSV file that opens in Excel, Numbers or Google Sheets. A CSV is for analysis; use a backup to restore.</p><button class="btn" data-a="csvall">Export all to CSV</button></section>
 <section class="card"><h2>Demo mode</h2>${d?`<p>You’re viewing sample data. Your own records are stored separately and are untouched.</p><div class="ac" style="margin-top:0"><button class="btn pri" data-a="exitdemo">Use my own data</button><button class="btn" data-a="resetdemo">Reset demo</button></div>`:`<p>Explore the app with sample data. Your own records stay untouched and the demo can be reset any time.</p><button class="btn" data-a="opendemo">Open demo</button>`}</section>

 <section class="card full"><h2>Clear my data</h2>${d?`<p>Switch to your own data to manage it.</p>`:`<p>Permanently deletes your transactions, budgets, goals and custom categories from this browser. You’ll be asked to confirm and offered a backup first.</p><button class="btn dg" data-a="clearask">Clear my data…</button>`}</section></div>`}
